<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — Susan Frye</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" type="image/svg+xml" href="bee.svg?v=2"/>
  <link rel="alternate icon" href="bee.svg?v=2"/>
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <a href="index.html" class="header-name">Susan Frye</a>
    <nav>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="research.html" class="nav-link">Research</a>
      <a href="talks.html" class="nav-link">Talks</a>
      <a href="cv.html" class="nav-link">CV</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>
  </header>

  <!-- ── Contact ── -->
  <section class="contact-section">
    <div class="contact-photo">
      <img src="BeeClubMeet20190622_sm2.jpg" alt="Susan Frye and Wild Bee Club members examining a bee nest together outdoors"/>
      <span class="photo-credit">Photo: Andrew Yee</span>
    </div>

    <h1 class="contact-title">Get in Touch</h1>
    <p class="contact-subtitle">Have a question, idea, or just want to say hi? Send a message below.</p>

    <!--
      NOTE FOR SUSAN:
      Right now this form opens the visitor's email app with a
      pre-filled message addressed to susanmafrye@gmail.com (see
      the JS at the bottom of this file) — no server needed.

      If you'd rather messages land directly in your inbox without
      the visitor needing an email client open, sign up for a free
      form-handling service like https://formspree.io, create a
      form pointed at susanmafrye@gmail.com, and:
        1. Change the <form> tag below to:
             <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        2. Remove the onsubmit="..." attribute on the form.
        3. Delete (or keep, harmless) the <script> at the bottom.
    -->
    <form class="contact-form" onsubmit="return sendViaEmail(event)">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Your email</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit" class="btn-green">Send message →</button>
    </form>

    <p class="contact-alt">
      Prefer email directly? Reach me at
      <a href="mailto:susanmafrye@gmail.com">susanmafrye@gmail.com</a>
    </p>
  </section>

  <footer>
    <p>© 2026 Susan Frye</p>
  </footer>

  <script>
    function sendViaEmail(event) {
      event.preventDefault();
      const name    = document.getElementById('name').value;
      const email   = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      const subject = encodeURIComponent(`Website message from ${name}`);
      const body    = encodeURIComponent(`${message}\n\n— ${name} (${email})`);

      window.location.href = `mailto:susanmafrye@gmail.com?subject=${subject}&body=${body}`;
      return false;
    }
  </script>

</body>
</html>
